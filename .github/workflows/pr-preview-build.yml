name: PR Preview - Build

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  build:
    uses: WordPress/action-wp-playground-pr-preview/.github/workflows/preview-build.yml@v3
    with:
      artifacts: richtext-extension=richtext-extension.zip
      node-version: '24'
      build-command: |
        npm ci
        npm run plugin-zip
